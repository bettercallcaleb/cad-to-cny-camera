    <text x="95" y="135" font-family="system-ui, sans-serif" font-size="28" fill="#334155">PRICE AT REGISTER</text>
    <text x="120" y="205" font-family="system-ui, sans-serif" font-size="62" font-weight="800" fill="#111827">7.99</text>
    <rect x="160" y="218" width="152" height="58" rx="12" fill="#166534"/>
    <text x="180" y="258" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="white">¥46.95</text>
