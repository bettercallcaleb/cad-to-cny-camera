<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">CAD to CNY Camera example overlay</title>
  <desc id="desc">Stylized phone camera view showing Canadian shelf prices with Chinese yuan overlays.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="56" y="76" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#f8fafc">Point camera → detect CAD → overlay CNY</text>
  <text x="56" y="114" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8">On-device OCR · retail heuristics · multi-frame tracking · no network permission</text>
  <g transform="translate(65 155)" filter="url(#shadow)">
